<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f4ee">
<title>KCP — Carte</title>
<link rel="icon" type="image/png" href="./kcp-mark-transparent.png">
<link rel="apple-touch-icon" href="./kcp-mark-transparent.png">
<script src="./config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./kcp.css">
<style>
  body { background:var(--bg); color:var(--ink); font-family:var(--font); max-width:1120px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:2.5rem 3rem 3rem; }
  .wrap { width:100%; display:flex; flex-direction:column; gap:1.15rem; }

  .back { display:inline-flex; align-items:center; gap:0.4rem; font-size:13px; font-family:var(--mono); font-weight:500; color:var(--ink-soft); text-decoration:none; padding:0.45rem 0.9rem; border:1.5px solid var(--border-strong); border-radius:100px; background:var(--surface); transition:all 0.15s; align-self:flex-start; margin-bottom:1.4rem; }

  .label { font-size:12px; font-family:var(--mono); color:var(--ink); letter-spacing:0.08em; text-transform:uppercase; font-weight:500; display:flex; align-items:center; justify-content:space-between; }

  /* ── CARTE ── */
  .map-box { width:100%; display:flex; justify-content:center; }
  .map-box svg { display:block; max-width:100%; height:auto; overflow:visible; }

  /* Charpente : la hiérarchie descendante. Mobilier structurel, jamais estompé. */
  .charpente line { stroke:var(--border); stroke-width:1.2; }

  /* Massif : région commune derrière des lignes contiguës. Aucun trait. */
  .massif { fill:var(--surface2); stroke:none; transition:opacity 0.15s; }

  .lien-forte { stroke:var(--ink-soft); stroke-width:1.6; fill:none; }

  .noeud circle { fill:var(--surface); stroke:var(--ink-soft); stroke-width:1.6; cursor:pointer; transition:fill 0.15s, stroke 0.15s; }
  .noeud.composite circle { fill:var(--ink-soft); }
  .noeud text { font-family:var(--mono); font-size:13px; fill:var(--ink-soft); cursor:pointer;
    paint-order:stroke fill; stroke:var(--surface); stroke-width:3.5px; stroke-linejoin:round; }
  .noeud.enmassif text { stroke:var(--surface2); }
  .noeud.composite text { font-weight:500; fill:var(--ink); }
  .noeud.racine text { font-size:15px; font-weight:500; fill:var(--ink); }
  .noeud:hover circle { stroke:var(--accent-deep); fill:var(--accent); }
  .noeud:hover text { fill:var(--ink); font-weight:500; }
  .estompe { opacity:0.18; transition:opacity 0.15s; }
  .surligne.lien-forte { stroke:var(--accent-deep); stroke-width:2.2; }


  /* ── LISTE (mobile) ── */
  .liste { display:none; flex-direction:column; }
  .li-row { display:flex; align-items:center; gap:0.6rem; padding:0.7rem 0; border-top:1px solid var(--border); text-decoration:none; color:var(--ink); }
  .li-row:first-child { border-top:none; }
  .li-nom { font-size:14px; font-family:var(--mono); font-weight:500; }
  .li-row.composite .li-nom { font-weight:700; }
  .li-row.massif .li-nom { background:var(--surface2); border-radius:5px; padding:0.1rem 0.35rem; margin:0 -0.35rem; }
  .li-branche { color:var(--border-strong); font-family:var(--mono); font-size:12px; white-space:pre; }

  /* ── FICHE (popover) : l'état du sujet, données seules, aucun lien ── */
  .voile { display:none; position:fixed; inset:0; background:rgba(22,21,15,0.32); z-index:40; }
  .voile.on { display:block; }
  .fiche { display:none; position:fixed; z-index:41; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(560px, calc(100vw - 2.5rem)); max-height:82vh; overflow-y:auto;
    background:var(--surface); border:1.5px solid var(--border-strong); border-radius:var(--r);
    padding:1.5rem 1.6rem 1.6rem; box-shadow:0 18px 50px rgba(22,21,15,0.18); }
  .fiche.on { display:block; }
  .fiche-titre { font-size:19px; font-weight:700; letter-spacing:-0.01em; padding-right:2rem; }
  .fiche-meta { font-size:12px; font-family:var(--mono); color:var(--muted); margin-top:0.35rem; }
  .fiche-x { position:absolute; top:1rem; right:1rem; width:30px; height:30px; border:1.5px solid var(--border-strong);
    border-radius:100px; background:var(--surface); color:var(--ink-soft); font-size:14px; cursor:pointer; line-height:1; }
  .fiche-x:hover { border-color:var(--ink); color:var(--ink); }
  .fiche-sec { margin-top:1.15rem; }
  .fiche-lbl { font-size:11px; font-family:var(--mono); color:var(--ink); letter-spacing:0.08em; text-transform:uppercase; font-weight:500; }
  .fiche-txt { font-size:14px; line-height:1.55; margin-top:0.4rem; white-space:pre-line; }
  .fiche-li { font-size:13px; font-family:var(--mono); line-height:1.5; margin-top:0.45rem; padding-left:1rem; text-indent:-1rem; color:var(--ink-soft); }
  .fiche-li::before { content:'› '; color:var(--border-strong); }
  .fiche-vide { font-size:13px; font-family:var(--mono); color:var(--muted); line-height:1.5; margin-top:0.4rem; }

  .state { display:none; }
  .state.on { display:flex; }
  .loading { align-items:center; gap:0.75rem; padding:1rem; background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; }
  .spinner { width:16px; height:16px; border:2px solid var(--border-strong); border-top-color:var(--ink); border-radius:50%; animation:spin 0.7s linear infinite; flex-shrink:0; }
  .empty-state { display:none; font-size:13px; font-family:var(--mono); color:var(--muted); line-height:1.5; }
  .empty-state.on { display:block; }

  .footer { display:flex; align-items:center; justify-content:center; gap:0.5rem; }

  @media(max-width:680px){
    body { padding:2rem 1.25rem 3rem; }
    .map-box { display:none; }
    .liste { display:flex; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div>
    <a href="./index.html" class="back">← Retour</a>
    <span class="kcp-tag">KCP — Knowledge Context Protocol</span>
    <h1 class="page-title">Carte</h1>
  </div>

  <div class="card">
    <span class="label">
      Ton univers
      <span class="hint" id="count"></span>
    </span>

    <div class="note">
      <span class="ico">›</span>
      <span>La hiérarchie de tes sujets, à lire de haut en bas. Clique sur un sujet pour ouvrir sa fiche : son état, tenu à jour par ta mémoire.</span>
    </div>

    <div class="state loading on" id="s-loading">
      <div class="spinner"></div>
      <span class="loading-txt">Chargement…</span>
    </div>

    <div class="map-box" id="map"></div>

    <div class="liste" id="liste"></div>

    <div class="voile" id="voile"></div>
    <div class="fiche" id="fiche" role="dialog" aria-modal="true"></div>

    <div class="empty-state" id="s-empty">Aucun sujet à afficher pour l'instant.</div>
  </div>

  <div class="footer"><div class="dot"></div><span class="footer-text">système actif · KCP V2</span></div>

</div>
<script>
  const C = KCP_CONFIG;

  // Garde de session (config.js redirige déjà, double sécurité + id_client).
  const _session = (typeof kcpGetSession === 'function') ? kcpGetSession() : JSON.parse(localStorage.getItem('kcp_session') || 'null');
  if (!_session || !_session.client_id) { location.replace('./login.html'); }
  const id_client = _session ? _session.client_id : null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function show(id) { document.getElementById(id).classList.add('on'); }
  function hide(id) { document.getElementById(id).classList.remove('on'); }
  function cmpLabel(a, b) { return a.label.localeCompare(b.label, 'fr'); }

  // ── Métriques de l'organigramme, en pixels réels (aucune mise à l'échelle) ──
  const ROW = 24;        // hauteur d'une ligne de sujet
  const CHAR = 7.85;     // avance d'un caractère en DM Mono à 13px
  const TICK = 16;       // tiret entre l'épine de colonne et la pastille
  const DOTX = 21;       // centre de la pastille depuis le bord de colonne
  const TXTX = 33;       // début du libellé depuis le bord de colonne
  const COLGAP = 30;
  const HEAD = 30;       // bande d'en-tête d'un nœud porteur
  const DROP = 26;       // descente entre l'en-tête et la bande des enfants
  const PAD = 30;
  const MAXROWS = 22, MAXCOL = 3;
  const MINW = 560, MINH = 340;   // plancher de la toile, dessin centré dedans

  function labelW(n) { return String(n.label).length * CHAR; }
  function rowW(n) { return TXTX + labelW(n); }

  // ── Construction de l'arbre depuis la colonne parent ──
  // Racine = le nœud sans parent connu (le Head). Ordre alphabétique
  // par libellé à chaque niveau : la carte est déterministe.
  function buildTree(sujets) {
    const byId = {};
    // Le clic n'ouvre plus Notion : chaque nœud porte sa fiche, écrite par
    // le cycle de la mémoire dans le référentiel. Aucun lien sortant.
    sujets.forEach(function(s){ byId[s.doc_int_id] = { id: s.doc_int_id, label: s.doc_label || s.doc_int_id,
      fiche: { resume: s.fiche_resume || '', doutes: s.fiche_doutes || '', risques: s.fiche_risques || '',
               echeances: s.fiche_echeances || '', priorites: s.fiche_priorites || '',
               mots: parseInt(s.mots_absorbes, 10) || 0,
               blocs: s.block_count || '', maj: s.last_update_date || '' },
      children: [], _p: null, _cols: [], _colx: [] }; });
    let root = null;
    sujets.forEach(function(s){
      const n = byId[s.doc_int_id];
      const p = (s.parent || '').trim();
      if (p && byId[p]) { byId[p].children.push(n); n._p = byId[p]; }
      else if (!root || /^N\/?A$/i.test(p) || p === '') { if (!root) root = n; else if (/GCP001/.test(n.id)) root = n; }
    });
    if (!root) root = Object.values(byId)[0];
    // La racine porte le prénom de l'utilisateur : c'est sa mémoire.
    const prenom = (C.client_name || '').trim();
    if (prenom) root.label = prenom;
    (function sort(n){ n.children.sort(cmpLabel); n.children.forEach(sort); })(root);
    return { root: root, byId: byId };
  }

  // ── Massifs : composantes connexes des liaisons fortes ──
  // Deux composantes connexes ne peuvent pas se recouper : les massifs sont
  // disjoints par construction, un aplat suffit donc à les dire, sans trait.
  // On ne regroupe que des feuilles de même parent — la hiérarchie prime, et
  // une liaison qui traverse deux branches garde son trait.
  function massifs(nodes) {
    const uf = {};
    nodes.forEach(function(n){ uf[n.id] = n.id; });
    function find(x) { while (uf[x] !== x) { uf[x] = uf[uf[x]]; x = uf[x]; } return x; }
    return {
      union: function(a, b){ const ra = find(a.id), rb = find(b.id); if (ra !== rb) uf[ra] = rb; },
      seal: function(){
        const taille = {};
        nodes.forEach(function(n){ const r = find(n.id); taille[r] = (taille[r] || 0) + 1; });
        let k = 0; const num = {};
        nodes.forEach(function(n){
          const r = find(n.id);
          if (taille[r] < 2) return;
          if (num[r] === undefined) num[r] = k++;
          n._cl = num[r];
        });
        return k;
      }
    };
  }

  // Ordre alphabétique, chaque massif pris comme un bloc insécable posé à la
  // place de son premier membre : l'apparition d'un massif déplace ses membres,
  // pas la colonne entière. Déterministe, et stable dans le temps.
  function groupLeaves(leaves) {
    const byCl = {}, groups = [];
    leaves.forEach(function(l){
      if (l._cl == null) { groups.push([l]); return; }
      if (byCl[l._cl]) { byCl[l._cl].push(l); return; }
      byCl[l._cl] = [l]; groups.push(byCl[l._cl]);
    });
    groups.forEach(function(g){ g.sort(cmpLabel); });
    groups.sort(function(a, b){ return cmpLabel(a[0], b[0]); });
    return groups;
  }

  // ── Mesure ascendante : chaque nœud connaît sa boîte avant d'être posé ──
  function measure(n) {
    n._cols = []; n._colw = 0; n._leaves = []; n._comps = [];
    n._headw = 20 + labelW(n) * (n._racine ? 1.16 : 1);
    if (!n.children.length) { n._w = rowW(n); n._h = ROW; return; }

    n._leaves = n.children.filter(function(c){ return !c.children.length; });
    n._comps = n.children.filter(function(c){ return c.children.length; });
    n._comps.forEach(measure);

    if (n._leaves.length) {
      // Colonnes équilibrées, et jamais un massif à cheval sur deux colonnes.
      const ncol = Math.min(MAXCOL, Math.ceil(n._leaves.length / MAXROWS));
      const rows = Math.ceil(n._leaves.length / ncol);
      const cols = [[]];
      groupLeaves(n._leaves).forEach(function(g){
        const cur = cols[cols.length - 1];
        if (cur.length && cur.length + g.length > rows && cols.length < ncol) cols.push([]);
        cols[cols.length - 1] = cols[cols.length - 1].concat(g);
      });
      n._cols = cols;
      n._colw = Math.max.apply(null, n._leaves.map(rowW));
    }

    const leafW = n._cols.length ? n._cols.length * n._colw + (n._cols.length - 1) * COLGAP : 0;
    const leafH = n._cols.length ? Math.max.apply(null, n._cols.map(function(c){ return c.length; })) * ROW : 0;
    const compW = n._comps.reduce(function(a, c){ return a + c._w; }, 0) + Math.max(0, n._comps.length - 1) * COLGAP;
    const compH = n._comps.reduce(function(a, c){ return Math.max(a, c._h); }, 0);

    n._bandw = leafW + (leafW && compW ? COLGAP : 0) + compW;
    n._bandh = Math.max(leafH, compH);
    n._w = Math.max(n._headw, n._bandw);
    n._h = HEAD + DROP + n._bandh;
  }

  // ── Pose descendante : bande d'en-tête, puis bande des enfants centrée ──
  function enTete(n) { return n.children.length > 0 || !n._p; }

  function place(n, x, y) {
    n._hx = x + n._w / 2; n._hy = y + HEAD / 2;
    n._hdx = n._hx - n._headw / 2 + 7; n._anchors = [];
    if (!n.children.length) return;
    const bandY = y + HEAD + DROP;
    n._bandy = bandY;
    let bx = x + (n._w - n._bandw) / 2;
    n._colx = [];
    n._cols.forEach(function(col, ci){
      const cx = bx + ci * (n._colw + COLGAP);
      n._colx.push(cx);
      col.forEach(function(leaf, ri){
        leaf._cx = cx;
        leaf._y = bandY + ri * ROW + ROW / 2;
        leaf._x = cx + DOTX;
        leaf._tx = cx + TXTX;
      });
    });
    if (n._cols.length) bx += n._cols.length * n._colw + (n._cols.length - 1) * COLGAP + COLGAP;
    n._comps.forEach(function(c){ place(c, bx, bandY); bx += c._w + COLGAP; });

    // La descente part de la pastille, pas du centre du bloc. Et quand il n'y
    // a qu'un seul point d'accroche, la pastille se pose juste au-dessus :
    // un trait droit, sans coude.
    n._anchors = n._colx.concat(n._comps.map(function(c){ return c._hx; }));
    n._hdx = n._hx - n._headw / 2 + 7;
    if (n._anchors.length === 1) { n._hx += n._anchors[0] - n._hdx; n._hdx = n._anchors[0]; }
  }

  // Les liaisons sortent par la droite de la ligne, après le libellé, et
  // contournent par la droite : jamais un trait au travers d'un texte.
  function px(n) { return enTete(n) ? n._hx + n._headw / 2 : n._cx + n._p._colw + 7; }
  function py(n) { return enTete(n) ? n._hy : n._y; }

  function render(data) {
    hide('s-loading');
    const sujets = (data && data.sujets) || [];
    const liaisons = (data && data.liaisons) || [];
    if (!sujets.length) { document.getElementById('count').textContent = ''; show('s-empty'); return; }
    hide('s-empty');

    const t = buildTree(sujets);
    const nodes = Object.values(t.byId);
    t.root._racine = true;

    // Liaisons dédupliquées par paire, les deux extrémités visibles.
    const seen = {}, edges = [];
    liaisons.forEach(function(l){
      const a = t.byId[l.source_id], b = t.byId[l.cible_id];
      if (!a || !b || a === b) return;
      const k = [l.source_id, l.cible_id].sort().join('|');
      if (seen[k]) return;
      seen[k] = true;
      edges.push({ a: a, b: b, forte: String(l.intensite).toLowerCase() === 'forte', type: l.type || '', objet: l.objet || '' });
    });

    nodes.forEach(function(n){ n._cl = null; });

    const uf = massifs(nodes);
    edges.forEach(function(e){
      if (!e.forte) return;
      if (e.a.children.length || e.b.children.length) return;   // feuilles seulement
      if (e.a._p !== e.b._p) return;                            // même parent seulement
      uf.union(e.a, e.b);
    });
    uf.seal();   // assigne les _cl : le dessin des massifs en dépend

    measure(t.root);
    place(t.root, 0, 0);

    // ── Toile ajustée au contenu, avec un plancher : un sujet unique s'affiche
    // à la même échelle que quarante, centré dans un cadre franc. ──
    let VX = -PAD, VY = -PAD, VW = t.root._w + 2 * PAD, VH = t.root._h + 2 * PAD;
    if (VW < MINW) { VX -= (MINW - VW) / 2; VW = MINW; }
    if (VH < MINH) { VY -= (MINH - VH) / 2; VH = MINH; }

    let svg = '<svg viewBox="' + VX.toFixed(0) + ' ' + VY.toFixed(0) + ' ' + VW.toFixed(0) + ' ' + VH.toFixed(0) +
      '" style="width:min(' + Math.round(VW) + 'px, 100%)" role="img" aria-label="Carte des sujets">';

    // ── Charpente : descente, barre de distribution, épines, tirets ──
    let ch = '';
    nodes.forEach(function(n){
      if (!n.children.length) return;
      const busY = n._bandy - DROP / 2;
      const anchors = n._anchors;
      ch += '<line x1="' + n._hdx.toFixed(1) + '" y1="' + (n._hy + 11).toFixed(1) + '" x2="' + n._hdx.toFixed(1) + '" y2="' + busY.toFixed(1) + '"/>';
      const x0 = Math.min.apply(null, anchors.concat([n._hdx])), x1 = Math.max.apply(null, anchors.concat([n._hdx]));
      if (x1 - x0 > 0.5) ch += '<line x1="' + x0.toFixed(1) + '" y1="' + busY.toFixed(1) + '" x2="' + x1.toFixed(1) + '" y2="' + busY.toFixed(1) + '"/>';
      anchors.forEach(function(ax){
        ch += '<line x1="' + ax.toFixed(1) + '" y1="' + busY.toFixed(1) + '" x2="' + ax.toFixed(1) + '" y2="' + n._bandy.toFixed(1) + '"/>';
      });
      n._cols.forEach(function(col, ci){
        const cx = n._colx[ci];
        ch += '<line x1="' + cx.toFixed(1) + '" y1="' + n._bandy.toFixed(1) + '" x2="' + cx.toFixed(1) + '" y2="' + col[col.length - 1]._y.toFixed(1) + '"/>';
        col.forEach(function(leaf){
          ch += '<line x1="' + cx.toFixed(1) + '" y1="' + leaf._y.toFixed(1) + '" x2="' + (cx + TICK).toFixed(1) + '" y2="' + leaf._y.toFixed(1) + '"/>';
        });
      });
    });
    svg += '<g class="charpente">' + ch + '</g>';

    // ── Massifs : un aplat derrière des lignes contiguës ──
    nodes.forEach(function(n){
      n._cols.forEach(function(col){
        let i = 0;
        while (i < col.length) {
          const cl = col[i]._cl;
          let j = i;
          while (cl != null && j + 1 < col.length && col[j + 1]._cl === cl) j++;
          if (cl != null && j > i) {
            const membres = col.slice(i, j + 1).map(function(m){ return m.id; }).join(' ');
            svg += '<rect class="massif" data-n="' + esc(membres) + '" x="' + (col[i]._cx + TICK - 5).toFixed(1) +
              '" y="' + (col[i]._y - ROW / 2 + 3).toFixed(1) + '" width="' + (n._colw - TICK + 10).toFixed(1) +
              '" height="' + ((j - i + 1) * ROW - 6).toFixed(1) + '" rx="9"/>';
          }
          i = j + 1;
        }
      });
    });

    // ── Liaisons : seules les fortes entre branches se tracent. Les massifs
    // disent les fortes locales ; les faibles vivent dans la fiche du sujet. ──
    edges.forEach(function(e){
      if (!e.forte) return;
      if (e.a._cl != null && e.a._cl === e.b._cl) return;
      const ax = px(e.a), ay = py(e.a), bx = px(e.b), by = py(e.b);
      const cx = Math.max(ax, bx) + 30, cy = (ay + by) / 2;
      svg += '<path class="lien-forte" data-n="' + esc(e.a.id) + ' ' + esc(e.b.id) +
        '" d="M' + ax.toFixed(1) + ' ' + ay.toFixed(1) + ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + bx.toFixed(1) + ' ' + by.toFixed(1) +
        '"><title>' + esc(e.type) + (e.objet ? ' — ' + esc(e.objet) : '') + '</title></path>';
    });

    // ── Nœuds : pastille d'en-tête pour les porteurs, ligne pour les sujets ──
    nodes.forEach(function(n){
      // La nature vient de l'identifiant, jamais du nombre d'enfants :
      // un noeud vide de ses enfants reste un noeud.
      const comp = String(n.id || '').indexOf('GCP') === 0;
      const cls = 'noeud' + (comp ? ' composite' : '') + (n._racine ? ' racine' : '') + (n._cl != null ? ' enmassif' : '');
      let cx, cy, tx;
      if (enTete(n)) { cx = n._hdx; cy = n._hy; tx = cx + 13; }
      else { cx = n._x; cy = n._y; tx = n._tx; }
      svg += '<g class="' + cls + '" data-id="' + esc(n.id) + '">' +
        '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + (n._racine ? 7.5 : comp ? 6.5 : 5.5) + '"/>' +
        '<text x="' + tx.toFixed(1) + '" y="' + (cy + 4.6).toFixed(1) + '">' + esc(n.label) + '</text></g>';
    });
    svg += '</svg>';

    document.getElementById('map').innerHTML = svg;
    document.getElementById('count').textContent = sujets.length + ' sujet' + (sujets.length > 1 ? 's' : '');

    // Survol : le sujet, son massif et ses liaisons restent nets, le reste s'estompe.
    // La charpente ne bouge pas — c'est la structure, pas une réponse à la lecture.
    const allRel = document.querySelectorAll('#map [data-n]');
    const allNodes = document.querySelectorAll('#map .noeud');
    allNodes.forEach(function(g){
      const id = g.dataset.id;
      g.addEventListener('mouseenter', function(){
        const keep = {};
        keep[id] = true;
        allRel.forEach(function(l){
          const ids = l.dataset.n.split(' ');
          if (ids.indexOf(id) === -1) { l.classList.add('estompe'); }
          else { l.classList.add('surligne'); ids.forEach(function(x){ keep[x] = true; }); }
        });
        allNodes.forEach(function(o){ if (!keep[o.dataset.id]) o.classList.add('estompe'); });
      });
      g.addEventListener('mouseleave', function(){
        allRel.forEach(function(l){ l.classList.remove('estompe'); l.classList.remove('surligne'); });
        allNodes.forEach(function(o){ o.classList.remove('estompe'); });
      });
      g.addEventListener('click', function(){ openFiche(t.byId[g.dataset.id], edges); });
    });

    // ── Liste indentée (mobile) : même hiérarchie, mêmes massifs, même fiche ──
    let html = '';
    (function walk(n, prefix){
      // La nature vient de l'identifiant, jamais du nombre d'enfants :
      // un noeud vide de ses enfants reste un noeud.
      const comp = String(n.id || '').indexOf('GCP') === 0;
      html += '<a class="li-row' + (comp ? ' composite' : '') + (n._cl != null ? ' massif' : '') + '" data-id="' + esc(n.id) + '">' +
        '<span class="li-branche">' + prefix + '</span>' +
        '<span class="li-nom">' + esc(n.label) + '</span></a>';
      // Même ordre qu'à l'écran : massifs contigus, puis le reste.
      const suite = groupLeaves(n.children.filter(function(c){ return !c.children.length; }))
        .reduce(function(a, g){ return a.concat(g); }, [])
        .concat(n.children.filter(function(c){ return c.children.length; }));
      suite.forEach(function(c, i){
        const isLast = i === suite.length - 1;
        walk(c, prefix.replace('└─', '  ').replace('├─', '│ ') + (isLast ? '└─' : '├─'));
      });
    })(t.root, '');
    document.getElementById('liste').innerHTML = html;
    document.querySelectorAll('#liste .li-row').forEach(function(row){
      row.addEventListener('click', function(){ openFiche(t.byId[row.dataset.id], edges); });
    });
  }

  // ── La fiche : l'état du sujet, écrit par le cycle, lu ici. Données seules. ──
  // Les mots absorbés d'un nœud sont la somme de tout son sous-arbre : un nœud
  // n'absorbe pas lui-même, il consolide ce que ses sujets ont absorbé.
  function motsSousArbre(n) {
    let total = (n.fiche && n.fiche.mots) || 0;
    (n.children || []).forEach(function(c){ total += motsSousArbre(c); });
    return total;
  }

  const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  function frDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso).trim());
    if (!m) return null;
    const jour = parseInt(m[3], 10), mois = MOIS[parseInt(m[2], 10) - 1];
    if (!mois || !jour) return null;
    const annee = (String(new Date().getFullYear()) === m[1]) ? '' : ' ' + m[1];
    return jour + ' ' + mois + annee;
  }
  function nombreFr(x) { return String(x).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f'); }

  // Échéances : AAAA-MM-JJ;objet, triées par date croissante, remises en
  // toutes lettres. Une ligne qui ne suit pas le format s'affiche brute,
  // en fin de liste — jamais de fiche cassée pour une date malformée.
  function lignesEcheances(txt) {
    const brutes = String(txt).split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    const datees = [], autres = [];
    brutes.forEach(function(l){
      const i = l.indexOf(';');
      const d = i > 0 ? l.slice(0, i).trim() : '';
      const fd = frDate(d);
      if (fd) datees.push({ d: d, txt: fd + ' — ' + l.slice(i + 1).trim() });
      else autres.push(l);
    });
    datees.sort(function(a, b){ return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
    return datees.map(function(e){ return '<div class="fiche-li">' + esc(e.txt) + '</div>'; }).join('') +
           autres.map(function(l){ return '<div class="fiche-li">' + esc(l) + '</div>'; }).join('');
  }

  function openFiche(n, edges) {
    if (!n) return;
    const f = n.fiche || {};
    let h = '<button class="fiche-x" id="fiche-x" aria-label="Fermer">✕</button>' +
      '<div class="fiche-titre">' + esc(n.label) + '</div>';

    const meta = [];
    const mots = motsSousArbre(n);
    if (mots > 0) meta.push(nombreFr(mots) + ' mots d\'information absorbés');
    if (f.blocs) meta.push(f.blocs + ' lignes');
    if (f.maj) meta.push('mise à jour le ' + (frDate(f.maj) || esc(f.maj)));
    if (meta.length) h += '<div class="fiche-meta">' + meta.join(' · ') + '</div>';

    const lignes = function(txt){
      return String(txt).split('\n').map(function(l){ return l.trim(); }).filter(Boolean)
        .map(function(l){ return '<div class="fiche-li">' + esc(l) + '</div>'; }).join('');
    };

    if (f.resume) {
      h += '<div class="fiche-sec"><span class="fiche-lbl">Résumé</span><div class="fiche-txt">' + esc(f.resume) + '</div></div>';
    } else {
      h += '<div class="fiche-sec"><div class="fiche-vide">La fiche de ce sujet sera générée au prochain cycle de ta mémoire.</div></div>';
    }
    if (f.echeances) h += '<div class="fiche-sec"><span class="fiche-lbl">Prochaines échéances</span>' + lignesEcheances(f.echeances) + '</div>';
    if (f.priorites) h += '<div class="fiche-sec"><span class="fiche-lbl">Priorités</span>' + lignes(f.priorites) + '</div>';
    if (f.risques) h += '<div class="fiche-sec"><span class="fiche-lbl">Risques</span>' + lignes(f.risques) + '</div>';
    if (f.doutes) h += '<div class="fiche-sec"><span class="fiche-lbl">Doutes ouverts</span>' + lignes(f.doutes) + '</div>';

    const liens = (edges || []).filter(function(e){ return e.a === n || e.b === n; });
    if (liens.length) {
      h += '<div class="fiche-sec"><span class="fiche-lbl">Relations</span>' +
        liens.map(function(e){
          const autre = e.a === n ? e.b : e.a;
          let l = esc(autre.label) + ' · ' + (e.forte ? 'forte' : 'faible');
          if (e.type) l += ' — ' + esc(e.type);
          if (e.objet) l += ', ' + esc(e.objet);
          return '<div class="fiche-li">' + l + '</div>';
        }).join('') + '</div>';
    }

    document.getElementById('fiche').innerHTML = h;
    document.getElementById('fiche').classList.add('on');
    document.getElementById('voile').classList.add('on');
    document.getElementById('fiche-x').addEventListener('click', closeFiche);
  }
  function closeFiche() {
    document.getElementById('fiche').classList.remove('on');
    document.getElementById('voile').classList.remove('on');
  }
  document.getElementById('voile').addEventListener('click', closeFiche);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeFiche(); });

  async function fetchCarte() {
    const r = await kcpFetch(C.webhooks.carte, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ client_id: id_client })
    });
    const raw = await r.text();
    const cleaned = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
    return JSON.parse(cleaned);
  }

  // Cache d'abord, revalidation réseau systématique.
  async function load() {
    const cached = (typeof kcpReadCarteCache === 'function') ? kcpReadCarteCache() : null;
    if (cached) render(cached);
    try {
      const data = await fetchCarte();
      if (typeof kcpCacheCarte === 'function') kcpCacheCarte(data);
      render(data);
    } catch (e) {
      hide('s-loading');
      if (!cached) { show('s-empty'); }
    }
  }

  load();
</script>
