<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KCP | Connexion</title>
<link rel="icon" type="image/png" href="./kcp-mark-transparent.png">
<link rel="apple-touch-icon" href="./kcp-mark-transparent.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<script src="config.js"></script>
<style>
  body { display:grid; place-items:center; min-height:100vh; padding:var(--s5) var(--s4); }
  .boite { width:min(420px,100%); display:flex; flex-direction:column; gap:var(--s4); }
  .marque { display:flex; align-items:center; gap:var(--s2); }
  .carte-f { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--r);
    padding:var(--s4); display:flex; flex-direction:column; gap:var(--s3); }
  .mini { align-self:flex-end; font-size:var(--t-sm); color:var(--muted); text-decoration:none; }
  .mini:hover { color:var(--ink); }
</style>
</head><body>
  <main class="boite">
    <div>
      <div class="marque"><div class="mark">K</div><span class="side-name">KCP</span><span class="tag-beta">bêta</span></div>
      <h1 style="margin-top:var(--s3)">Connexion</h1>
      <p class="sub" style="margin-top:.4rem">Accédez à votre mémoire.</p>
    </div>
    <form class="carte-f" id="f">
      <div class="champ"><label for="e">Email</label>
        <input type="email" id="e" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <div class="champ"><label for="p">Mot de passe</label>
        <input type="password" id="p" autocomplete="current-password">
        <a class="mini" href="reset-password.html" id="lnk-reset">Mot de passe oublié ?</a></div>
      <div class="alerte-err" id="err" hidden><span>›</span><span id="err-txt"></span></div>
      <button class="btn btn-1" id="go" style="justify-content:center">Se connecter →</button>
    </form>
  </main>
<script>
  // Déjà connecté → directement à l'accueil.
  if (kcpGetSession()) { location.replace('./index.html'); }

  var btn = document.getElementById('go');

  function showErr(m) { document.getElementById('err-txt').textContent = m; document.getElementById('err').hidden = false; }
  function clearErr() { document.getElementById('err').hidden = true; }

  // Toute la mécanique de mot de passe vit dans reset-password.html.
  // On transmet simplement l'email déjà saisi, pour ne pas le retaper.
  document.getElementById('lnk-reset').addEventListener('click', function (ev) {
    ev.preventDefault();
    var v = document.getElementById('e').value.trim();
    location.href = './reset-password.html' + (v ? '?email=' + encodeURIComponent(v) : '');
  });

  // Reconstruit une URL Notion à partir d'un UUID (seul l'UUID transite).
  // Le référentiel garde l'UUID avec tirets (format canonique de l'API),
  // mais app.notion.com exige désormais l'identifiant SANS tirets dans l'URL.
  function notionUrl(uuid) {
    if (!uuid) return '';
    var clean = String(uuid).trim().replace(/-/g, '');
    return clean ? 'https://app.notion.com/p/' + clean : '';
  }

  async function doLogin() {
    var username = document.getElementById('e').value.trim();
    var password = document.getElementById('p').value;
    clearErr();
    if (!username || !password) { showErr('Email et mot de passe requis.'); return; }

    kcpOccupe(btn, true);
    try {
      var r = await kcpFetch(KCP_CONFIG.webhooks.auth, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });
      var raw = await r.text();
      var cleaned = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
      var d = {}; try { d = JSON.parse(cleaned); } catch (e) { d = {}; }

      // Succès si ok !== false ET un client_id est renvoyé.
      var okFlag = (d.ok === undefined) ? true : !!d.ok;
      if (r.ok && okFlag && d.client_id) {
        kcpSetSession({
          client_id: d.client_id,
          client_name: d.client_name || d.client_id,
          notion: {
            tiroirs: notionUrl(d.notion_uuid_tiroirs) || (d.notion && d.notion.tiroirs) || '',
            reunions: notionUrl(d.notion_uuid_reunions) || (d.notion && d.notion.reunions) || '',
          },
        });
        location.replace('./index.html');
        return;
      }
      showErr(d.message || d.error || 'Email ou mot de passe incorrect.');
    } catch (e) {
      showErr('Connexion impossible. Réessayez.');
    }
    kcpOccupe(btn, false);
  }

  document.getElementById('f').addEventListener('submit', function (ev) { ev.preventDefault(); doLogin(); });
  document.getElementById('e').focus();
</script>
</body></html>
