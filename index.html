  <main class="main">
    <div class="stack">
      <div>
        <span class="eyebrow" id="compte"></span>
        <h1 style="margin-top:.4rem" id="bonjour">Bonjour</h1>
      </div>

      <div class="note" id="bandeau" hidden><span>›</span><span id="bandeau-txt"></span></div>

      <div>
        <div class="ligne-titre"><div class="sect-title">Votre mémoire</div></div>
        <div class="carte-cadre" id="cadre">
          <span class="plier" id="plier" hidden>
            <button type="button" id="tout-deplier">Tout déplier</button>
            <button type="button" id="tout-replier">Tout replier</button>
          </span>
          <div class="chargement" id="carte-attente">Chargement de votre carte…</div>
          <div id="svg-boite" hidden><svg class="arbre" id="svg" role="img" aria-label="Carte de vos sujets"></svg></div>
        </div>
      </div>
    </div>

</div>
<script src="arbre.js"></script>
<script>
  var C = KCP_CONFIG;

  // ── Barre latérale : nom, réunions, badges ──
  (function nav() {
    var n = (C.client_name || '').trim();
    document.getElementById('nav-who').textContent = n || '—';
    document.getElementById('nav-avatar').textContent = (n.charAt(0) || 'K').toUpperCase();
    var r = (C.notion && C.notion.reunions) || '';
    if (r) {
      document.getElementById('nav-reunions').href = kcpNotionHref(r);
      document.getElementById('nav-reunions').hidden = false;
      document.getElementById('grp-notion').hidden = false;
    }
    kcpNavBadges();
  })();
  document.getElementById('bonjour').textContent = 'Bonjour ' + ((C.client_name || '').trim() || '');

  // ── État partagé entre la carte, la fiche et le bandeau ──
  // `points` est chargé une fois et sert trois usages : le bandeau, les
  // pastilles de la carte, et le bloc de questions de la fiche.
  var points = [], sujetsCarte = [], comptes = { propres: {}, descendance: {} };

  // ── La carte : cache affiché tout de suite, réseau revalide en fond ──
  var ouverts = {}, svg = document.getElementById('svg'), donneesArbre = null;

  function estEns(id) { return String(id).indexOf('GCP') === 0; }

  // La réponse du webhook `carte` (une ligne par document, parent par identifiant)
  // devient l'arbre du premier niveau : les enfants directs du Head, ensembles
  // puis sujets, chacun en ordre alphabétique — la carte reste stable.
  function construireArbre(sujets) {
    var enfants = {};
    sujets.forEach(function (s) { (enfants[s.parent] = enfants[s.parent] || []).push(s); });
    function cle(s) { return String(s.doc_label || '').replace(/^#/, ''); }
    function tri(a, b) { return cle(a).localeCompare(cle(b), 'fr', { sensitivity: 'base' }); }
    var n1 = (enfants['GCP001'] || []).slice();
    var ens = n1.filter(function (s) { return estEns(s.doc_int_id); }).sort(tri);
    var suj = n1.filter(function (s) { return !estEns(s.doc_int_id); }).sort(tri);
    return ens.concat(suj).map(function (s) {
      var e = (enfants[s.doc_int_id] || []).slice().sort(tri)
        .map(function (c) { return { id: c.doc_int_id, label: c.doc_label }; });
      return { id: s.doc_int_id, label: s.doc_label, n: e.length || undefined, enfants: e.length ? e : undefined };
    });
  }

  function rendre() {
    if (!donneesArbre) return;
    document.getElementById('carte-attente').hidden = true;
    // `hidden` est un attribut HTML : il ne s'applique pas a un <svg>, qui vit
    // dans l'espace de noms SVG. C'est la boite qui porte la bascule.
    document.getElementById('svg-boite').hidden = false;
    // Les deux boutons n'ont de sens qu'une fois la carte dessinée.
    document.getElementById('plier').hidden = false;
    KCP_ARBRE.dessine(svg, {
      racine: (C.client_name || '').trim() || 'Head',
      donnees: donneesArbre, ouverts: ouverts,
      // Les questions du document, et le total de sa descendance pour un
      // nœud — à la place de l'ancien compte d'enfants.
      questions: comptes.propres, sousQuestions: comptes.descendance, noeudCreux: true,
      onOuvrir: function (n) { ouverts[n.id] = !ouverts[n.id]; rendre(); },
      // Un clic ouvre la fiche sur place ; « Ouvrir la page » y mène ensuite.
      onSel: function (n) { ouvrirFiche(n.id); }
    });
  }

  // ── Les deux gestes opposés. L'état déplié vit déjà dans la page :
  // rien à demander au réseau, rien à recalculer. ──
  function toutDeplier() {
    (donneesArbre || []).forEach(function (d) { if (d.enfants) ouverts[d.id] = true; });
    rendre();
  }
  function toutReplier() { ouverts = {}; rendre(); }
  document.getElementById('tout-deplier').addEventListener('click', toutDeplier);
  document.getElementById('tout-replier').addEventListener('click', toutReplier);

  function ouvrirFiche(id) {
    var doc = null;
    sujetsCarte.forEach(function (x) { if (x.doc_int_id === id) doc = x; });
    KCP_FICHE.ouvrir(doc, points, (C.client_name || '').trim() || 'Head', svg);
  }

  function poserCarte(data) {
    var sujets = (data && data.sujets) || [];
    if (!sujets.length) return false;
    sujetsCarte = sujets;
    comptes = kcpComptesQuestions(points, sujets);
    donneesArbre = construireArbre(sujets);
    var n1 = sujets.filter(function (s) { return s.parent === 'GCP001'; }).length;
    document.getElementById('compte').textContent = n1 + ' entrée' + (n1 > 1 ? 's' : '') +
      ' · ' + sujets.length + ' document' + (sujets.length > 1 ? 's' : '');
    rendre();
    return true;
  }

  // Les questions déjà en cache, posées avant la carte : les pastilles
  // s'affichent dès le premier rendu, sans attendre le réseau.
  (function questionsEnCache() {
    var cp = kcpReadPointsCache();
    if (cp && cp.points) points = cp.points;
  })();

  (function chargerCarte() {
    var cached = kcpReadCarteCache();
    if (cached) poserCarte(cached);
    kcpFetch(KCP_CONFIG.webhooks.carte, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ client_id: C.client_id })
    }).then(function (r) { return r.text(); }).then(function (raw) {
      var cleaned = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
      var data = {}; try { data = JSON.parse(cleaned); } catch (e) { data = {}; }
      if (data && data.sujets && data.sujets.length) { kcpCacheCarte(data); poserCarte(data); }
    }).catch(function () {
      if (!donneesArbre) {
        var a = document.getElementById('carte-attente');
        a.className = 'alerte-err'; a.textContent = 'La carte n’a pas pu être chargée. Rechargez la page.';
      }
    });
  })();

  // ── Le bandeau : ce qui attend une réponse, questions et réorganisations ──
  var nPoints = null, nProps = null;

  function majBandeau() {
    var el = document.getElementById('bandeau'), txt = document.getElementById('bandeau-txt');
    var q = nPoints || 0, p = nProps || 0, total = q + p;
    if (!total) { el.hidden = true; kcpNavBadges(); return; }
    txt.textContent = '';
    var b = document.createElement('b');
    b.textContent = total + ' élément' + (total > 1 ? 's' : '') + (total > 1 ? ' attendent' : ' attend') + ' votre réponse';
    txt.appendChild(b);
    var detail = q && p
      ? q + ' question' + (q > 1 ? 's' : '') + ' et ' + p + ' réorganisation' + (p > 1 ? 's' : '') + ' proposées par le cycle de cette nuit.'
      : q ? q + ' question' + (q > 1 ? 's' : '') + ' posée' + (q > 1 ? 's' : '') + ' par le cycle de cette nuit.'
          : p + ' réorganisation' + (p > 1 ? 's' : '') + ' proposée' + (p > 1 ? 's' : '') + ' par le cycle de cette nuit.';
    txt.appendChild(document.createTextNode(' — ' + detail + ' '));
    var a = document.createElement('a');
    a.href = q ? 'a-clarifier.html' : 'reorganiser.html';
    a.style.color = 'var(--accent-deep)';
    a.textContent = 'Les traiter →';
    txt.appendChild(a);
    el.hidden = false;
    kcpNavBadges();
  }

  (function compteurs() {
    var cp = kcpReadPointsCache(), cr = kcpReadPropsCache();
    if (cp) nPoints = (cp.points || []).length;   // `points` est déjà posé plus haut
    if (cr) nProps = (cr.propositions || []).length;
    if (cp || cr) majBandeau();

    kcpFetch(KCP_CONFIG.webhooks.points_a_clarifier, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ client_id: C.client_id })
    }).then(function (r) { return r.text(); }).then(function (raw) {
      var cleaned = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
      var d = {}; try { d = JSON.parse(cleaned); } catch (e) { d = {}; }
      if (d && d.points) {
        kcpCachePoints(d); points = d.points; nPoints = points.length; majBandeau();
        // La carte reflète les questions dès qu'elles arrivent du réseau.
        if (sujetsCarte.length) { comptes = kcpComptesQuestions(points, sujetsCarte); rendre(); }
      }
    }).catch(function () { /* le cache affiché reste */ });

    kcpFetch(KCP_CONFIG.webhooks.propositions, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ client_id: C.client_id })
    }).then(function (r) { return r.text(); }).then(function (raw) {
      var cleaned = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
      var d = {}; try { d = JSON.parse(cleaned); } catch (e) { d = {}; }
      if (d && d.propositions) { kcpCacheProps(d); nProps = d.propositions.length; majBandeau(); }
    }).catch(function () { /* le cache affiché reste */ });
  })();
</script>
</body></html>
