<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCP — Nouveau mot de passe</title>
<link rel="icon" type="image/png" href="./kcp-mark-transparent.png">
<link rel="apple-touch-icon" href="./kcp-mark-transparent.png">
<script src="./config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#f6f4ee; --surface:#ffffff; --surface2:#efece2;
    --border:#d3cebd; --border-strong:#b8b2a0;
    --ink:#16150f; --ink-soft:#3d3b30; --muted:#524e3e;
    --accent:#c8f55a; --accent-deep:#4d6b14;
    --dark:#14160f; --dark-soft:#1d2016; --dark-border:#2c2f22;
    --dark-text:#eef0e5; --dark-muted:#9aa088;
    --r:14px; --font:'Syne',sans-serif; --mono:'DM Mono',monospace;
  }
  html { background:#14160f; min-height:100vh; padding:0 1.5rem; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font); max-width:600px; margin:0 auto;  min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:2.5rem 2rem 3rem; }
  .wrap { width:100%; max-width:100%; display:flex; flex-direction:column; gap:1.15rem; }

  .back { display:inline-flex; align-items:center; gap:0.4rem; font-size:13px; font-family:var(--mono); font-weight:500; color:var(--ink-soft); text-decoration:none; padding:0.45rem 0.9rem; border:1.5px solid var(--border-strong); border-radius:100px; background:var(--surface); transition:all 0.15s; align-self:flex-start; margin-bottom:1.4rem; }
  .back:hover { color:var(--ink); border-color:var(--ink); }
  .kcp-tag { font-size:11px; font-family:var(--mono); color:var(--accent-deep); letter-spacing:0.15em; text-transform:uppercase; display:block; margin-bottom:0.7rem; }
  .page-title { font-size:28px; font-weight:700; letter-spacing:-0.02em; }
  .page-sub { font-size:13px; font-family:var(--mono); color:var(--muted); margin-top:0.35rem; }

  .card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--r); padding:1.5rem; box-shadow:0 1px 6px rgba(22,21,15,0.06); display:flex; flex-direction:column; gap:1.25rem; }

  .field { display:flex; flex-direction:column; gap:0.5rem; }
  .label { font-size:12px; font-family:var(--mono); color:var(--ink); letter-spacing:0.08em; text-transform:uppercase; font-weight:500; display:flex; align-items:center; justify-content:space-between; }
  .hint { font-size:12px; color:var(--muted); text-transform:none; letter-spacing:0; font-weight:500; font-family:var(--mono); }
  .hint.err { color:#8a2f2f; }

  input { width:100%; background:var(--surface2); color:var(--ink); border:1.5px solid var(--border); border-radius:10px; padding:0.85rem 1rem; font-family:var(--font); font-size:15px; font-weight:600; outline:none; transition:border-color 0.15s; }
  input::placeholder { color:var(--muted); font-weight:400; }
  input:focus { border-color:var(--ink); background:var(--surface); }
  input:disabled { opacity:0.55; cursor:not-allowed; }

  .readonly { width:100%; background:var(--surface2); color:var(--ink-soft); border:1.5px solid var(--border); border-radius:10px; padding:0.85rem 1rem; font-family:var(--mono); font-size:14px; font-weight:500; overflow-wrap:anywhere; }

  .mini-link { align-self:flex-end; background:none; border:none; padding:0; font-size:12px; font-family:var(--mono); font-weight:500; color:var(--muted); cursor:pointer; transition:color 0.15s; }
  .mini-link:hover { color:var(--ink); }

  .btn-dark { width:100%; padding:1rem; background:var(--dark); color:var(--dark-text); border:none; border-radius:10px; font-family:var(--font); font-size:15px; font-weight:700; cursor:pointer; transition:background 0.15s, transform 0.1s; }
  .btn-dark:hover { background:var(--dark-soft); }
  .btn-dark:active { transform:scale(0.99); }
  .btn-dark:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; }

  /* States */
  .state { display:none; }
  .state.on { display:flex; }
  .loading { align-items:center; gap:0.75rem; padding:1rem; background:var(--surface2); border:1.5px solid var(--border); border-radius:10px; }
  .spinner { width:16px; height:16px; border:2px solid var(--border-strong); border-top-color:var(--ink); border-radius:50%; animation:spin 0.7s linear infinite; flex-shrink:0; }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-txt { font-size:14px; font-family:var(--mono); color:var(--ink-soft); }

  .success { flex-direction:column; gap:0.75rem; padding:1.25rem; background:var(--dark); border:1.5px solid var(--dark-border); border-radius:10px; position:relative; overflow:hidden; }
  .success::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--accent); }
  .s-msg { font-size:14px; font-family:var(--mono); color:var(--dark-text); line-height:1.5; }
  .s-link { font-size:13px; font-family:var(--mono); font-weight:500; color:var(--accent); text-decoration:none; align-self:flex-start; }
  .s-link:hover { text-decoration:underline; }

  .error-state { display:none; padding:0.9rem 1rem; border:1.5px solid var(--border-strong); border-radius:10px; font-size:13px; font-family:var(--mono); color:var(--ink-soft); line-height:1.5; }
  .error-state.on { display:block; }

  .footer { display:flex; align-items:center; justify-content:center; gap:0.5rem; }
  .footer-text { font-size:11px; font-family:var(--mono); color:var(--muted); }
  .dot { width:5px; height:5px; border-radius:50%; background:var(--accent-deep); animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.6)}}

  .wrap > * { opacity:0; transform:translateY(8px); animation:up 0.3s ease forwards; }
  .wrap > :nth-child(1){animation-delay:.04s} .wrap > :nth-child(2){animation-delay:.09s}
  .wrap > :nth-child(3){animation-delay:.13s} .wrap > :nth-child(4){animation-delay:.17s}
  @keyframes up{to{opacity:1;transform:translateY(0)}}
  /* iOS : >=16px sur les champs pour éviter le zoom automatique au focus */
  @media(max-width:600px){ html{padding:0} body{border-radius:0; min-height:100vh} input{ font-size:16px; } }
</style>
</head>
<body>
<div class="wrap">

  <div>
    <a href="./login.html" class="back">← Connexion</a>
    <span class="kcp-tag">KCP — Knowledge Context Protocol</span>
    <h1 class="page-title">Nouveau mot de passe</h1>
    <p class="page-sub">Choisis le mot de passe de ton espace KCP.</p>
  </div>

  <div class="card">
    <div class="field">
      <span class="label">Compte</span>
      <div class="readonly" id="acct">—</div>
    </div>

    <div class="field">
      <label class="label" for="pwd">
        Nouveau mot de passe
        <span class="hint" id="pwd-hint">min. 10 caractères</span>
      </label>
      <input type="password" id="pwd" placeholder="••••••••••" autocomplete="new-password" autocapitalize="none" spellcheck="false" oninput="check()" onkeydown="handleKey(event)">
      <button type="button" class="mini-link" id="toggle" onclick="toggleView()">Afficher</button>
    </div>

    <button class="btn-dark" id="submit" onclick="submit()" disabled>Définir le mot de passe →</button>

    <div class="state loading" id="s-loading">
      <div class="spinner"></div>
      <span class="loading-txt">Enregistrement en cours…</span>
    </div>

    <div class="error-state" id="s-error"></div>
  </div>

  <div class="state success" id="s-success">
    <span class="s-msg">Mot de passe défini. Tu peux maintenant te connecter.</span>
    <a href="./login.html" class="s-link">Aller à la connexion →</a>
  </div>

  <div class="footer"><div class="dot"></div><span class="footer-text">système actif · KCP V2</span></div>

</div>
<script>
  const C = KCP_CONFIG;

  // Page publique : on y arrive déconnecté, depuis le lien reçu par email.
  const params = new URLSearchParams(location.search);
  const token = (params.get('token') || '').trim();
  const email = (params.get('email') || '').trim();

  const MIN = 10;
  const pwdEl = document.getElementById('pwd');
  const submitEl = document.getElementById('submit');
  const hintEl = document.getElementById('pwd-hint');
  const toggleEl = document.getElementById('toggle');

  function show(id) { document.getElementById(id).classList.add('on'); }
  function hide(id) { document.getElementById(id).classList.remove('on'); }
  function showErr(m) { const e = document.getElementById('s-error'); e.textContent = m; e.classList.add('on'); }
  function clearErr() { document.getElementById('s-error').classList.remove('on'); }

  // Lien incomplet : rien à valider, on désactive le formulaire.
  let ready = !!(token && email);
  if (ready) {
    document.getElementById('acct').textContent = email;
  } else {
    document.getElementById('acct').textContent = '—';
    pwdEl.disabled = true;
    toggleEl.style.display = 'none';
    showErr('Ce lien est incomplet. Demande-en un nouveau depuis la page de connexion.');
  }

  function toggleView() {
    const shown = pwdEl.type === 'text';
    pwdEl.type = shown ? 'password' : 'text';
    toggleEl.textContent = shown ? 'Afficher' : 'Masquer';
  }

  function handleKey(e) { if (e.key === 'Enter') { e.preventDefault(); if (!submitEl.disabled) submit(); } }

  // Le mot de passe n'est ni trimmé ni transformé : il part verbatim.
  function check() {
    const len = pwdEl.value.length;
    if (len > 0 && len < MIN) {
      const reste = MIN - len;
      hintEl.textContent = 'encore ' + reste + ' caractère' + (reste > 1 ? 's' : '');
      hintEl.classList.add('err');
    } else {
      hintEl.textContent = 'min. ' + MIN + ' caractères';
      hintEl.classList.remove('err');
    }
    submitEl.disabled = !(ready && len >= MIN);
  }

  async function submit() {
    const nouveau_mdp = pwdEl.value;
    if (!ready || nouveau_mdp.length < MIN) return;

    clearErr();
    hide('s-success');
    submitEl.style.display = 'none';
    show('s-loading');

    let res, data = {};
    try {
      res = await fetch(C.webhooks.reset_password, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'confirmation', email, token, nouveau_mdp })
      });
      // Toutes les réponses sortent en 200 : lire le corps avant de conclure.
      const raw = await res.text();
      const cleaned = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
      try { data = JSON.parse(cleaned); } catch (e) { data = {}; }
    } catch (e) {
      hide('s-loading');
      submitEl.style.display = '';
      showErr('Enregistrement impossible. Réessaie.');
      return;
    }

    hide('s-loading');

    if (res.ok && data.success) {
      pwdEl.disabled = true;
      toggleEl.style.display = 'none';
      show('s-success');
    } else if (data.error === 'invalid_token') {
      ready = false;
      pwdEl.disabled = true;
      toggleEl.style.display = 'none';
      showErr('Ce lien n\'est plus valide, il a déjà été utilisé. Demande-en un nouveau depuis la page de connexion.');
    } else {
      submitEl.style.display = '';
      showErr('Enregistrement impossible. Réessaie.');
    }
  }

  check();
  if (ready) pwdEl.focus();
</script>
</body>
</html>
